name: Continuous Integration

on:
  push:
    branches: [main, hafidz]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ""
      LLM_API_KEY: ""
      ADMIN_API_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pytest pytest-asyncio pytest-cov
      - name: Run tests with coverage
        run: python -m pytest -q --cov=app --cov-report=term

  frontend:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

  deploy:
    name: Deploy to Production
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: Deploy Production Containers
        run: |
          cd /home/praktikan/projects/verifin
          git fetch origin main
          git reset --hard origin/main
          export GIT_COMMIT=$(git rev-parse --short HEAD)
          export BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          docker compose up -d --build
