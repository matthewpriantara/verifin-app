services:
  verifin-backend:
    image: ghcr.io/matthewpriantara/verifin-app-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: verifin-backend
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "8019:8000"
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/uploads:/app/uploads/evidence

  verifin-frontend:
    image: ghcr.io/matthewpriantara/verifin-app-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.verifin.web.id}
    container_name: verifin-frontend
    restart: unless-stopped
    ports:
      - "3019:3000"
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-verifin2026}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-verifin-admin-secret-change-me-2026}
    depends_on:
      - verifin-backend
