services:
  verifin-backend:
    image: ghcr.io/matthewpriantara/verifin-app-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-dev}
        BUILD_TIME: ${BUILD_TIME:-}
    container_name: verifin-backend
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "8019:8000"
    env_file:
      - ./backend/.env
    environment:
      - GIT_COMMIT=${GIT_COMMIT:-dev}
      - BUILD_TIME=${BUILD_TIME:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/uploads:/app/uploads/evidence
      # Unix socket reverse tunnel GetContact (produksi). Di home direktori ini kosong.
      - ${GETCONTACT_SOCKET_DIR:-./infra/getcontact-api/run}:/run/gtc

  verifin-frontend:
    image: ghcr.io/matthewpriantara/verifin-app-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Tanpa titik dua: NEXT_PUBLIC_API_URL= (kosong) di .env berarti same-origin + rewrite.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-https://api.verifin.web.id}
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-}
        GIT_COMMIT: ${GIT_COMMIT:-dev}
        BUILD_TIME: ${BUILD_TIME:-}
    container_name: verifin-frontend
    restart: unless-stopped
    # Untuk rewrite /api/v1 ke backend yang memakai network_mode host (stack home).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3019:3000"
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_GIT_COMMIT=${GIT_COMMIT:-dev}
      - NEXT_PUBLIC_BUILD_TIME=${BUILD_TIME:-}
    depends_on:
      - verifin-backend
